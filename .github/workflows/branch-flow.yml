name: Branch flow

# Git Flow without a QA stage (see "Branch & PR workflow" in CLAUDE.md):
#   feature/* | bugfix/*  -> develop -> 19.0
#   hotfix/*  -> 19.0, then back-merge 19.0 -> develop
# Fails any PR into develop, 19.0 or the retired qa branch whose head/base pair is not part of that flow.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check head and base branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          name='[A-Za-z0-9._-]+'
          ok=1
          case "$BASE_REF" in
            develop)
              [[ "$HEAD_REF" =~ ^(feature|bugfix)/$name$ || "$HEAD_REF" == 19.0 ]] \
                || { ok=0; hint="into develop only feature/<ticket>-<name>, bugfix/<ticket>-<name> or the 19.0 hotfix back-merge"; } ;;
            qa)
              ok=0; hint="the qa stage is retired; release with a develop -> 19.0 PR" ;;
            19.0)
              [[ "$HEAD_REF" == develop || "$HEAD_REF" =~ ^hotfix/$name$ ]] \
                || { ok=0; hint="into 19.0 only develop (release) or hotfix/<ticket>-<name>"; } ;;
            *)
              echo "Base '$BASE_REF' is not a flow branch; nothing to check."; exit 0 ;;
          esac
          if [ "$ok" = 0 ]; then
            echo "::error::'$HEAD_REF' -> '$BASE_REF' is not allowed: $hint. See 'Branch & PR workflow' in CLAUDE.md."
            exit 1
          fi
          echo "'$HEAD_REF' -> '$BASE_REF' follows the branch flow."
